<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1090" viewBox="0 0 1080 1090"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#55738a"/></marker></defs><rect width="100%" height="100%" fill="#f2f6fa"/><text x="40" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="29" fill="#18324f" font-weight="700">SIS / Arquitectura ELT de tres bases</text><text x="40" y="80" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#18324f" font-weight="400">CSV directo en SSIS · valores originales conservados · publicación incremental en SQL</text><rect x="40" y="115" width="450" height="155" rx="14" fill="white" stroke="#ccdae4"/><rect x="40" y="115" width="450" height="43" rx="12" fill="#087e8b"/><text x="56" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">ARCHIVOS / APLICACIÓN</text><text x="56" y="188" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Original archivado y SHA-256</text><text x="56" y="215" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Revisión de cabecera y codificación</text><text x="56" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Excel: conversión secuencial excepcional</text><rect x="550" y="115" width="450" height="155" rx="14" fill="white" stroke="#ccdae4"/><rect x="550" y="115" width="450" height="43" rx="12" fill="#087e8b"/><text x="566" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">ENTRADA DESDE SQL</text><text x="566" y="188" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">raw.RecibirCambio(clave, versión, JSON)</text><text x="566" y="215" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Eventos U / D, reenvío idempotente</text><text x="566" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Cola durable, no watermark por fecha</text><path d="M265,270 L265,323" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M775,270 L775,323" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="325" width="960" height="190" rx="14" fill="white" stroke="#ccdae4"/><rect x="40" y="325" width="960" height="43" rx="12" fill="#087e8b"/><text x="56" y="353" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">SSIS / CONTROL FLOW</text><text x="56" y="398" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">01 Bloquear lote → 02 Flat File Source + Fast Load (CSV)</text><text x="56" y="425" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">03 Archivar RAW → 04 Validar → 05 Detectar cambios</text><text x="56" y="452" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">06 Normalizar → 07 Publicar estrella → 08 Conciliar y COMMIT</text><text x="56" y="479" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">OnError: ROLLBACK, auditoría y estado de error. DTExec fuera del diseñador.</text><path d="M190,515 L190,558" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="560" width="300" height="220" rx="14" fill="white" stroke="#ccdae4"/><rect x="40" y="560" width="300" height="43" rx="12" fill="#087e8b"/><text x="56" y="588" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">SIS_RAW</text><text x="56" y="633" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">raw.Registros: original por lote</text><text x="56" y="660" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">raw.EventosSQL: cola y versión</text><text x="56" y="687" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">etl.Lotes / Rechazos / Plan</text><text x="56" y="714" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">stg: trabajo temporal por lote</text><text x="56" y="741" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">RAW histórico no se trunca</text><rect x="390" y="560" width="300" height="220" rx="14" fill="white" stroke="#ccdae4"/><rect x="390" y="560" width="300" height="43" rx="12" fill="#087e8b"/><text x="406" y="588" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">SIS_NORMALIZADA</text><text x="406" y="633" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Región → Provincia → Distrito</text><text x="406" y="660" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">IPRESS / Unidad / Servicio</text><text x="406" y="687" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Seguro / Sexo / Grupo de edad</text><text x="406" y="714" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Registro_Atencion por aporte</text><text x="406" y="741" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">PK, FK, unicidad y linaje</text><rect x="740" y="560" width="300" height="220" rx="14" fill="white" stroke="#ccdae4"/><rect x="740" y="560" width="300" height="43" rx="12" fill="#087e8b"/><text x="756" y="588" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">SIS_DIMENSIONAL</text><text x="756" y="633" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">5 dimensiones conformadas</text><text x="756" y="660" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Fact_Atenciones agregada</text><text x="756" y="687" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Única por combinación del grano</text><text x="756" y="714" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">filas_origen + cantidad</text><text x="756" y="741" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Versión de publicación vigente</text><path d="M340,670 L390,670" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M690,670 L740,670" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="390" y="835" width="650" height="145" rx="14" fill="white" stroke="#ccdae4"/><rect x="390" y="835" width="650" height="43" rx="12" fill="#087e8b"/><text x="406" y="863" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">POWER BI / DIRECTQUERY</text><text x="406" y="908" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Consulta vistas pbi de SIS_DIMENSIONAL</text><text x="406" y="935" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Actualización de página abierta cada 10 segundos</text><text x="406" y="962" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Snapshot SQL consistente por consulta; sin NOLOCK</text><path d="M890,780 L890,835" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="40" y="1020" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18324f" font-weight="400">Snapshot: reemplaza el mes completo de su ámbito. SQL: cambia solo la clave/version recibida.</text><text x="40" y="1050" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18324f" font-weight="400">Las FK son internas a cada BD. El linaje entre BD se verifica por controles de integridad.</text></svg>