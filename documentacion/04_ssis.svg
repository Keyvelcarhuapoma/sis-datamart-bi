<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1150" viewBox="0 0 1060 1150"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#55738a"/></marker></defs><rect width="100%" height="100%" fill="#f2f6fa"/><text x="35" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#18324f" font-weight="700">SSIS / Control de ejecución y Data Flow nativo</text><path d="M485,170 L570,170" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M795,245 L795,300" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M570,375 L485,375" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M260,450 L260,505" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M485,580 L570,580" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M795,655 L795,710" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M570,785 L485,785" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="35" y="95" width="450" height="150" rx="14" fill="white" stroke="#ccdae4"/><rect x="35" y="95" width="450" height="43" rx="12" fill="#087e8b"/><text x="51" y="123" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">01_Iniciar_Lote_y_Bloquear</text><text x="51" y="168" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">sp_getapplock: escritor exclusivo</text><text x="51" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Crear lote; recuperar interrupciones</text><rect x="570" y="95" width="450" height="150" rx="14" fill="white" stroke="#ccdae4"/><rect x="570" y="95" width="450" height="43" rx="12" fill="#087e8b"/><text x="586" y="123" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">02_CSV_a_SIS_RAW_FastLoad</text><text x="586" y="168" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Flat File Source → stg.Entrada</text><text x="586" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Error de lectura → stg.ErroresLectura</text><rect x="570" y="300" width="450" height="150" rx="14" fill="white" stroke="#ccdae4"/><rect x="570" y="300" width="450" height="43" rx="12" fill="#087e8b"/><text x="586" y="328" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">03_Archivar_RAW_Historico</text><text x="586" y="373" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Append a raw.Registros por lote</text><text x="586" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">SQL: tomar hasta 1.000 eventos pendientes</text><rect x="35" y="300" width="450" height="150" rx="14" fill="white" stroke="#ccdae4"/><rect x="35" y="300" width="450" height="43" rx="12" fill="#087e8b"/><text x="51" y="328" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">04_Validar_Contrato_y_Nulos</text><text x="51" y="373" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Tipos, años autorizados, códigos y longitudes</text><text x="51" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Rechazar el lote si hay errores</text><rect x="35" y="505" width="450" height="150" rx="14" fill="white" stroke="#ccdae4"/><rect x="35" y="505" width="450" height="43" rx="12" fill="#087e8b"/><text x="51" y="533" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">05_Detectar_Incremento</text><text x="51" y="578" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Firma por periodo con multiplicidad</text><text x="51" y="605" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Plan de meses nuevos, iguales o corregidos</text><rect x="570" y="505" width="450" height="150" rx="14" fill="white" stroke="#ccdae4"/><rect x="570" y="505" width="450" height="43" rx="12" fill="#087e8b"/><text x="586" y="533" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">06_Normalizar_SIS_NORMALIZADA</text><text x="586" y="578" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">BEGIN TRAN; catálogos y relaciones</text><text x="586" y="605" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Reemplazar snapshot o aplicar claves SQL</text><rect x="570" y="710" width="450" height="150" rx="14" fill="white" stroke="#ccdae4"/><rect x="570" y="710" width="450" height="43" rx="12" fill="#087e8b"/><text x="586" y="738" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">07_Publicar_SIS_DIMENSIONAL</text><text x="586" y="783" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Dimensiones y hechos del grano definido</text><text x="586" y="810" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Reconstruir únicamente periodos afectados</text><rect x="35" y="710" width="450" height="150" rx="14" fill="white" stroke="#ccdae4"/><rect x="35" y="710" width="450" height="43" rx="12" fill="#087e8b"/><text x="51" y="738" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">08_Conciliar_y_Confirmar</text><text x="51" y="783" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Conciliar cantidades y aportes de origen</text><text x="51" y="810" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Confirmar eventos y publicación; COMMIT</text><rect x="35" y="910" width="985" height="150" rx="14" fill="white" stroke="#ccdae4"/><rect x="35" y="910" width="985" height="43" rx="12" fill="#087e8b"/><text x="51" y="938" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">CONTROLADORES DE EVENTOS</text><text x="51" y="983" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">OnError: ROLLBACK de la publicación; registrar error y estado del lote.</text><text x="51" y="1010" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">OnPostExecute: liberar bloqueo de sesión al terminar el paquete.</text><text x="51" y="1037" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Modo SQL: el Data Flow de archivo se desactiva; las etapas SQL procesan la cola.</text><text x="35" y="1110" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18324f" font-weight="400">Las tareas y conexiones existen en SIS_ELT_3BD.dtsx. Este diagrama explica el paquete ejecutable.</text></svg>