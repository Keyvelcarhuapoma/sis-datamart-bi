<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="960" viewBox="0 0 1090 960"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#55738a"/></marker></defs><rect width="100%" height="100%" fill="#f2f6fa"/><text x="35" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="27" fill="#18324f" font-weight="700">SIS_DIMENSIONAL / Modelo estrella y granularidad</text><path d="M530,235 L530,345" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M300,390 L360,420" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M800,390 L740,420" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M300,710 L400,555" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M800,710 L700,555" stroke="#55738a" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="365" y="95" width="350" height="140" rx="14" fill="white" stroke="#ccdae4"/><rect x="365" y="95" width="350" height="43" rx="12" fill="#087e8b"/><text x="381" y="123" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">Dim_Tiempo</text><text x="381" y="168" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">PK id_tiempo_sk</text><text x="381" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">UQ año + mes / periodo_codigo</text><rect x="35" y="315" width="265" height="190" rx="14" fill="white" stroke="#ccdae4"/><rect x="35" y="315" width="265" height="43" rx="12" fill="#087e8b"/><text x="51" y="343" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">Dim_IPRESS</text><text x="51" y="388" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">PK id_ipress_sk</text><text x="51" y="415" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">UQ id_ipress_oltp</text><text x="51" y="442" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">IPRESS, ubicación, unidad</text><text x="51" y="469" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Variante de atributos</text><rect x="800" y="315" width="260" height="160" rx="14" fill="white" stroke="#ccdae4"/><rect x="800" y="315" width="260" height="43" rx="12" fill="#087e8b"/><text x="816" y="343" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">Dim_Servicio</text><text x="816" y="388" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">PK id_servicio_sk</text><text x="816" y="415" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">UQ id_servicio_oltp</text><text x="816" y="442" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Código / descripción</text><rect x="35" y="630" width="265" height="145" rx="14" fill="white" stroke="#ccdae4"/><rect x="35" y="630" width="265" height="43" rx="12" fill="#087e8b"/><text x="51" y="658" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">Dim_Seguro</text><text x="51" y="703" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">PK id_seguro_sk</text><text x="51" y="730" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">UQ id_plan_oltp</text><rect x="800" y="630" width="260" height="160" rx="14" fill="white" stroke="#ccdae4"/><rect x="800" y="630" width="260" height="43" rx="12" fill="#087e8b"/><text x="816" y="658" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">Dim_Demografia</text><text x="816" y="703" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">PK id_demografia_sk</text><text x="816" y="730" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">UQ sexo + grupo de edad</text><rect x="360" y="345" width="380" height="220" rx="14" fill="white" stroke="#ccdae4"/><rect x="360" y="345" width="380" height="43" rx="12" fill="#087e8b"/><text x="376" y="373" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">Fact_Atenciones</text><text x="376" y="418" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">PK id_hecho_atencion</text><text x="376" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">5 FK → dimensiones</text><text x="376" y="472" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">UQ combinación de las 5 FK</text><text x="376" y="499" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">SUM cantidad_atenciones</text><text x="376" y="526" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">filas_origen · id_lote</text><text x="35" y="845" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#18324f" font-weight="700">Grano: mes × variante IPRESS × servicio × seguro × sexo y grupo de edad.</text><text x="35" y="885" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18324f" font-weight="400">Dos aportes iguales se conservan en normalizada y se suman en un único hecho del mismo grano.</text><text x="35" y="920" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18324f" font-weight="400">Los snapshots no eliminan los aportes SQL. Solo se reconstruyen los periodos afectados.</text></svg>