401" y="128" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">oltp.Provincia</text><text x="401" y="173" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">PK id_provincia</text><text x="401" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">FK id_region → Region</text><text x="401" y="227" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">UQ región + nombre</text><rect x="735" y="100" width="300" height="160" rx="14" fill="white" stroke="#ccdae4"/><rect x="735" y="100" width="300" height="43" rx="12" fill="#087e8b"/><text x="751" y="128" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">oltp.Distrito</text><text x="751" y="173" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">PK id_distrito</text><text x="751" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">FK id_provincia → Provincia</text><text x="751" y="227" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">UQ provincia + ubigeo + nombre</text><rect x="35" y="325" width="300" height="145" rx="14" fill="white" stroke="#ccdae4"/><rect x="35" y="325" width="300" height="43" rx="12" fill="#087e8b"/><text x="51" y="353" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">oltp.Unidad_Ejecutora</text><text x="51" y="398" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">PK id_unidad</text><text x="51" y="425" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">UQ clave_version (SHA-256)</text><rect x="735" y="325" width="300" height="205" rx="14" fill="white" stroke="#ccdae4"/><rect x="735" y="325" width="300" height="43" rx="12" fill="#087e8b"/><text x="751" y="353" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">oltp.IPRESS</text><text x="751" y="398" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">PK id_ipress</text><text x="751" y="425" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">FK id_distrito → Distrito</text><text x="751" y="452" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">FK id_unidad → Unidad</text><text x="751" y="479" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">UQ clave_version</text><text x="751" y="506" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Conserva variantes de atributos</text><rect x="35" y="590" width="260" height="145" rx="14" fill="white" stroke="#ccdae4"/><rect x="35" y="590" width="260" height="43" rx="12" fill="#087e8b"/><text x="51" y="618" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">oltp.Servicio</text><text x="51" y="663" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">PK id_servicio</text><text x="51" y="690" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">UQ clave_version</text><rect x="35" y="775" width="260" height="125" rx="14" fill="white" stroke="#ccdae4"/><rect x="35" y="775" width="260" height="43" rx="12" fill="#087e8b"/><text x="51" y="803" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">oltp.Plan_Seguro</text><text x="51" y="848" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">PK id_plan</text><text x="51" y="875" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">UQ nombre</text><rect x="385" y="775" width="270" height="125" rx="14" fill="white" stroke="#ccdae4"/><rect x="385" y="775" width="270" height="43" rx="12" fill="#087e8b"/><text x="401" y="803" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">oltp.Sexo</text><text x="401" y="848" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">PK id_sexo</text><text x="401" y="875" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">UQ nombre</text><rect x="735" y="775" width="300" height="125" rx="14" fill="white" stroke="#ccdae4"/><rect x="735" y="775" width="300" height="43" rx="12" fill="#087e8b"/><text x="751" y="803" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">oltp.Grupo_Edad</text><text x="751" y="848" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">PK id_grupo_edad</text><text x="751" y="875" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">UQ nombre</text><rect x="385" y="555" width="650" height="180" rx="14" fill="white" stroke="#ccdae4"/><rect x="385" y="555" width="650" height="43" rx="12" fill="#087e8b"/><text x="401" y="583" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="white" font-weight="700">oltp.Registro_Atencion</text><text x="401" y="628" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">PK id_registro_atencion · FK IPRESS / servicio / plan / sexo / edad</text><text x="401" y="655" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">UQ id_raw · UQ archivo + fila · UQ clave_origen para fuente SQL</text><text x="401" y="682" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Año / mes / cantidad · fuente SNAPSHOT o SQL · versión de origen</text><text x="401" y="709" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#18324f" font-weight="400">Un registro = un aporte agregado recibido; no es un paciente</text><text x="35" y="950" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18324f" font-weight="400">oltp.OrigenVersion: PK clave_origen; conserva versión incluso después de una baja SQL.</text><text x="35" y="985" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#18324f" font-weight="400">id_raw referencia lógicamente SIS_RAW.raw.Registros; SQL Server no admite FK entre bases.</text></svg>